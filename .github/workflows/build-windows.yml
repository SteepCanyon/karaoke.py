name: Build Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller python-vlc yt-dlp requests packaging PySocks

      - name: Build POT Server
        run: |
          git clone https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git
          cd bgutil-ytdlp-pot-provider/server
          npm ci --include=dev
          .\node_modules\.bin\tsc
          cd ../..
          mkdir node_server
          xcopy /E /I bgutil-ytdlp-pot-provider\server\build node_server\build
          xcopy /E /I bgutil-ytdlp-pot-provider\server\node_modules node_server\node_modules
          copy bgutil-ytdlp-pot-provider\server\package.json node_server\

      - name: Fetch ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $exe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in archive" }
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          Copy-Item $exe.FullName "ffmpeg\ffmpeg.exe"

      - name: Fetch VLC
        shell: pwsh
        run: |
          $url = "https://get.videolan.org/vlc/3.0.21/win64/vlc-3.0.21-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile "vlc.zip"
          Expand-Archive -Path "vlc.zip" -DestinationPath "vlc_tmp" -Force
          Move-Item -Path "vlc_tmp\vlc-3.0.21" -Destination "vlc"
          Remove-Item -Path "vlc.zip"
          Remove-Item -Path "vlc_tmp" -Recurse

      - name: Build .exe
        shell: pwsh
        run: |
          $args = @(
            "--noconfirm", "--windowed", "--onedir",
            "--name", "KaraokePlayer",
            "--icon", "AppIcon.ico",
            "--add-data", "ffmpeg;ffmpeg",
            "--add-data", "vlc;vlc",
            "--hidden-import", "vlc",
            "--hidden-import", "yt_dlp",
            "--collect-all", "yt_dlp"
          )
          if (Test-Path "zapret\Zapret.exe") { $args += @("--add-data", "zapret;zapret") }
          if (Test-Path "node_server\build\main.js") { $args += @("--add-data", "node_server;node_server") }
          $args += "karaoke.py"
          pyinstaller @args

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          @"
          [Setup]
          AppName=KaraokePlayer
          AppVersion=${{ github.ref_name }}
          DefaultDirName={autopf}\KaraokePlayer
          DefaultGroupName=KaraokePlayer
          OutputDir=Output
          OutputBaseFilename=KaraokePlayer-Setup-${{ github.ref_name }}
          Compression=lzma
          SolidCompression=yes
          SetupIconFile=AppIcon.ico
          [Files]
          Source: "dist\KaraokePlayer\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\KaraokePlayer"; Filename: "{app}\KaraokePlayer.exe"
          "@ | Out-File -Encoding ASCII installer.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\KaraokePlayer -DestinationPath KaraokePlayer-Windows.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KaraokePlayer-Windows
          path: |
            Output\KaraokePlayer-Setup-*.exe
            KaraokePlayer-Windows.zip

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/KaraokePlayer-Setup-*.exe
            KaraokePlayer-Windows.zip
